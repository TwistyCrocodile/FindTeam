server:
  port: 8080

spring:
  application:
    name: findteam
  datasource:
    url: jdbc:h2:mem:findteam
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  mini-app-url: ${TELEGRAM_MINI_APP_URL:}
  long-polling:
    enabled: ${TELEGRAM_LONG_POLLING_ENABLED:true}

findteam:
  broadcast:
    reddit-games-with-hook:
      enabled: false
    prometheus-july-ai:
      enabled: false
    prometheus-july-ai-link:
      enabled: false

---

spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/findteam}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:findteam}
    password: ${DB_PASSWORD:findteam}
  jpa:
    show-sql: true
    hibernate:
      # Local PostgreSQL development only. Production should use migrations later, e.g. Flyway or Liquibase.
      ddl-auto: update
