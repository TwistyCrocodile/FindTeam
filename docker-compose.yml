services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: findteam
      POSTGRES_USER: findteam
      POSTGRES_PASSWORD: findteam
    ports:
      - "5432:5432"
    volumes:
      - findteam_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findteam -d findteam"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/findteam
      DB_USERNAME: findteam
      DB_PASSWORD: findteam
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  findteam_postgres_data:

